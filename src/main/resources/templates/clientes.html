<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartamentos | Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" th:href="@{/vista/apartamentos}">APARTAMENTOS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/vista/apartamentos}">Apartamentos</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning fw-bold" th:href="@{/vista/clientes}">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/vista/reservaciones}">Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/vista/pagos}">Pagos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/vista/reportes}">Reportes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="d-flex justify-content-between align-items-end border-bottom border-warning border-3 mb-4 pb-3">
            <div>
                <p class="text-uppercase small text-secondary mb-1">Administración</p>
                <h1 class="h2 mb-0">Clientes</h1>
            </div>
            <span class="badge text-bg-dark fs-6" th:text="${#lists.size(clientes)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white"><h2 class="h5 mb-0">Registrar cliente</h2></div>
                    <div class="card-body">
                        <form th:action="@{/vista/clientes/guardar}" method="post">
                            <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input id="nombre" name="nombre" class="form-control" required></div>
                            <div class="mb-3"><label class="form-label" for="apellidos">Apellidos</label><input id="apellidos" name="apellidos" class="form-control" required></div>
                            <div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" class="form-control" required></div>
                            <div class="mb-3"><label class="form-label" for="telefono">Teléfono</label><input id="telefono" name="telefono" class="form-control"></div>
                            <div class="mb-4">
                                <label class="form-label" for="tipo">Tipo de cliente</label>
                                <select id="tipo" name="tipo" class="form-select" required>
                                    <option value="ARRENDATARIO">Arrendatario (renta)</option>
                                    <option value="PROPIETARIO">Propietario (dueño)</option>
                                </select>
                            </div>
                            <button class="btn btn-warning w-100 fw-bold" type="submit">Guardar cliente</button>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white"><h2 class="h5 mb-0">Listado de clientes</h2></div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light"><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Tipo</th><th class="text-end">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="c : ${clientes}">
                                    <td th:text="${c.id}"></td>
                                    <td class="fw-semibold" th:text="${c.nombre + ' ' + c.apellidos}"></td>
                                    <td th:text="${c.correo}"></td>
                                    <td th:text="${c.telefono}"></td>
                                    <td><span class="badge" th:classappend="${c.tipo == 'PROPIETARIO'} ? 'text-bg-primary' : 'text-bg-info'" th:text="${c.tipo}"></span></td>
                                    <td class="text-end text-nowrap">
                                        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="modal" th:data-bs-target="'#editar-' + ${c.id}">Editar</button>
                                        <form class="d-inline" th:action="@{/vista/clientes/{id}/eliminar(id=${c.id})}" method="post"><button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('¿Eliminar este cliente?')">Eliminar</button></form>

                                        <div class="modal fade text-start" th:id="'editar-' + ${c.id}" tabindex="-1" aria-hidden="true">
                                            <div class="modal-dialog"><div class="modal-content">
                                                <form th:action="@{/vista/clientes/{id}/actualizar(id=${c.id})}" method="post">
                                                    <div class="modal-header"><h3 class="modal-title fs-5">Editar cliente</h3><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                                    <div class="modal-body">
                                                        <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" th:value="${c.nombre}" required></div>
                                                        <div class="mb-3"><label class="form-label">Apellidos</label><input name="apellidos" class="form-control" th:value="${c.apellidos}" required></div>
                                                        <div class="mb-3"><label class="form-label">Correo electrónico</label><input name="correo" type="email" class="form-control" th:value="${c.correo}" required></div>
                                                        <div class="mb-3"><label class="form-label">Teléfono</label><input name="telefono" class="form-control" th:value="${c.telefono}"></div>
                                                        <div><label class="form-label">Tipo de cliente</label>
                                                            <select name="tipo" class="form-select">
                                                                <option value="ARRENDATARIO" th:selected="${c.tipo == 'ARRENDATARIO'}">Arrendatario (renta)</option>
                                                                <option value="PROPIETARIO" th:selected="${c.tipo == 'PROPIETARIO'}">Propietario (dueño)</option>
                                                            </select></div>
                                                    </div>
                                                    <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-warning fw-bold" type="submit">Guardar cambios</button></div>
                                                </form>
                                            </div></div>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="6" class="text-center text-secondary py-4">No hay clientes registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
